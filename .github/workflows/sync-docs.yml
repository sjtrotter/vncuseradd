name: sync-docs

# Runs ./build, which regenerates vncuseradd.8.gz from vncuseradd.8.md and
# syncs the OPTIONS block into README.md and the usage() function. If
# anything changed, the workflow commits the regenerated files back to the
# branch.
#
# Required permission: contents:write (set below).

on:
  pull_request:
    paths:
      - vncuseradd.8.md
      - vncuseradd
      - README.md
      - build
      - .github/workflows/sync-docs.yml
  push:
    branches: [main]
    paths:
      - vncuseradd.8.md
      - vncuseradd
      - README.md
      - build

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # On fork PRs the GITHUB_TOKEN is read-only, so the auto-commit step
    # would fail. Fall back to fail-on-drift behavior for forks.
    steps:
      - name: Checkout (PR branch, so we can push back)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (fork PR or push to main)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Run build
        run: ./build

      - name: Commit regenerated files (same-repo PR or main)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No drift; generated files already in sync."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'auto-sync generated docs

          Regenerated by .github/workflows/sync-docs.yml from
          vncuseradd.8.md via ./build.'
          git push

      - name: Fail on drift (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo '::error::Generated files are out of sync with vncuseradd.8.md.'
            echo '::error::Run ./build locally and commit the result. Diff:'
            git --no-pager diff
            exit 1
          fi
